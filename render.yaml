# Render blueprint for the Rgi Service API.
#
# The storefront is NOT deployed here — it goes to Vercel (CLAUDE.md §2: "Frontend:
# Vercel. API + DB: VPS or Atlas"). This file only describes the NestJS server.
#
# To use it: Render → New → Blueprint → pick this repo. Render reads this file, creates
# the service, and prompts for the secrets marked `sync: false`. See DEPLOY.md.

services:
  - type: web
    name: rgi-service-api
    runtime: node
    plan: free
    # Frankfurt is the closest Render region to Morocco, and matches the Atlas region.
    region: frankfurt
    branch: main
    # Build from the repo root: the API depends on two workspace packages, and its own
    # `prebuild` script compiles them before `nest build` runs.
    # `--include=dev` is not optional here. This service sets NODE_ENV=production, and npm
    # honours that by omitting devDependencies — but the compiler (`typescript`) and the
    # Nest CLI (`@nestjs/cli`) are devDependencies, so without it the install succeeds and
    # the build dies on `nest: not found`. Only the build needs them; the running service
    # uses dist/.
    buildCommand: npm ci --include=dev && npm run build --workspace=@rgi/api
    startCommand: npm run start --workspace=@rgi/api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      # Pin the runtime instead of drifting with Render's default. Root package.json
      # requires >=20; 22 is what the build is developed and tested against.
      - key: NODE_VERSION
        value: "22"
      # Render injects PORT; main.ts reads it and binds 0.0.0.0.

      # ── secrets: entered in the Render dashboard, never committed ──
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        # Long random values, generated by Render rather than chosen by hand.
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # ── non-secret configuration ──
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: CLOUDINARY_UPLOAD_PRESET
        value: rgi_service_products
      # Namespaces this project's media inside a Cloudinary account shared with another
      # project, and is the folder the delete guard enforces.
      - key: CLOUDINARY_FOLDER
        value: rgi-service/products
      # Comma-separated. A single leading wildcard is allowed per entry, which is what
      # lets every Vercel preview deployment talk to this API.
      # Set the real values once the Vercel domain exists — see DEPLOY.md step 4.
      - key: CORS_ORIGINS
        sync: false

      # ── seeded admin account ──
      # Set a real password here. Leaving it unset falls back to the documented default,
      # which is public in this repo.
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
